name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://portal:${{ github.run_id }}-ci-only@localhost:5432/enterprise_portal_ci
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: ${{ github.run_id }}-ci-only
          POSTGRES_DB: enterprise_portal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d enterprise_portal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:RELEASE.2024-12-18T13-15-44Z
        env:
          MINIO_ROOT_USER: local-access
          MINIO_ROOT_PASSWORD: local-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        command: server /data
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Generate an ephemeral auth secret
        run: printf 'AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec prisma migrate deploy --schema database/schema.prisma
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @portal/api test:integration
      - name: Verify real MinIO storage
        env:
          MINIO_E2E: '1'
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: portal-files
          S3_ACCESS_KEY: local-access
          S3_SECRET_KEY: local-secret
        run: pnpm storage:e2e
      - run: pnpm build

  browser-e2e:
    needs: validate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
      DATABASE_URL: postgresql://portal:${{ github.run_id }}-ci-only@localhost:5432/enterprise_portal_ci
      REDIS_URL: redis://localhost:6379
      APP_URL: http://127.0.0.1:3000
      AUTH_SECRET: ci-browser-secret-that-is-at-least-32-characters
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: ${{ github.run_id }}-ci-only
          POSTGRES_DB: enterprise_portal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d enterprise_portal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec prisma migrate deploy --schema database/schema.prisma
      - name: Create CI environment file for seed
        run: |
          printf 'NODE_ENV=test\nAUTH_SECRET=%s\nLOCAL_ADMIN_EMAIL=admin@company.local\nLOCAL_ADMIN_PASSWORD=ChangeMe123!\nDATABASE_URL=%s\nREDIS_URL=redis://localhost:6379\nAPP_URL=http://127.0.0.1:3000\n' "$AUTH_SECRET" "$DATABASE_URL" > .env
      - run: pnpm db:seed
      - run: pnpm --filter @portal/api dev > api-e2e.log 2>&1 &
      - run: pnpm --filter @portal/web dev > web-e2e.log 2>&1 &
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
