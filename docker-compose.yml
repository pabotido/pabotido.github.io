services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev_password
      POSTGRES_DB: enterprise_portal
    ports: ["5432:5432"]
    volumes: [portal_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d enterprise_portal"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [portal_redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    profiles: ["storage"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-access
      MINIO_ROOT_PASSWORD: local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [portal_minio_data:/data]

volumes:
  portal_postgres_data:
  portal_redis_data:
  portal_minio_data:
